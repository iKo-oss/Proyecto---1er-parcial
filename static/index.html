<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creador de outfits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg1: #fbc2eb; --bg2: #a6c1ee; --bg3: #ffecd2;
  --glass: rgba(255, 255, 255, 0.65);
  --border: rgba(255, 255, 255, 0.4);
  --text: #2f3542; --mut: #57606f;
  --acc: #ff4757; --acc-hover: #ff6b81;
}
@media(prefers-color-scheme: dark) {
  :root {
    --bg1: #1e3c72; --bg2: #2a5298; --bg3: #192a56;
    --glass: rgba(20, 20, 30, 0.65);
    --border: rgba(255, 255, 255, 0.1);
    --text: #f1f2f6; --mut: #a4b0be;
    --acc: #ff6b81; --acc-hover: #ff4757;
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
  font-family: 'Montserrat', sans-serif; color: var(--text); min-height: 100vh;
  background: linear-gradient(120deg, var(--bg1), var(--bg2), var(--bg3));
  background-size: 200% 200%;
  animation: moveBg 12s ease infinite;
  padding: 40px 20px;
}
@keyframes moveBg { 
  0% { background-position: 0% 50%; } 
  50% { background-position: 100% 50%; } 
  100% { background-position: 0% 50%; } 
}
@keyframes slideUp { 
  from { opacity: 0; transform: translateY(30px); } 
  to { opacity: 1; transform: translateY(0); } 
}
@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}

main { max-width: 800px; margin: 0 auto; }
h1 { font-size: 3rem; font-weight: 800; text-align: center; margin-bottom: 8px; letter-spacing: -1px; text-shadow: 0 4px 12px rgba(0,0,0,0.1); }
.sub { text-align: center; font-weight: 500; font-size: 1.1rem; color: var(--text); opacity: 0.8; margin-bottom: 40px; }

.glass {
  background: var(--glass);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: 24px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.1);
}

form { padding: 30px; display: grid; gap: 20px; grid-template-columns: 1fr 1fr; margin-bottom: 30px; }
@media(max-width: 550px) { form { grid-template-columns: 1fr; } }

label { display: grid; gap: 8px; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--mut); }
select { font-family: 'Montserrat', sans-serif; font-size: 1rem; font-weight: 500; padding: 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--glass); color: var(--text); cursor: pointer; transition: all 0.3s; outline: none; }
select:focus { border-color: var(--acc); box-shadow: 0 0 0 3px rgba(255, 71, 87, 0.2); }
select option { background: var(--bg2); color: var(--text); } /* Para legibilidad del menú nativo */

button { 
  grid-column: 1 / -1; background: var(--acc); color: white; border: none; padding: 16px; border-radius: 12px; 
  font-family: 'Montserrat', sans-serif; font-size: 1.2rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
  cursor: pointer; transition: all 0.3s; margin-top: 10px;
}
button:hover { background: var(--acc-hover); transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255, 71, 87, 0.3); }
button:disabled { background: var(--mut); cursor: wait; transform: none; box-shadow: none; animation: pulse 1.5s infinite; }

#estado { text-align: center; font-weight: 700; font-size: 1.1rem; margin-bottom: 20px; min-height: 24px; }
.msg { padding: 20px; text-align: center; font-weight: 600; color: var(--acc); }

.card { padding: 24px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 16px; transition: transform 0.3s, box-shadow 0.3s; }
.card:hover { transform: translateY(-5px) scale(1.01); box-shadow: 0 15px 40px rgba(0,0,0,0.15); }

.prendas { display: flex; flex-wrap: wrap; gap: 12px; }
.chip { 
  display: inline-flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.4); 
  border: 1px solid var(--border); border-radius: 30px; padding: 8px 16px 8px 10px; 
  font-size: 0.95rem; font-weight: 600; transition: transform 0.2s, background 0.2s; 
}
.chip:hover { transform: scale(1.05); background: rgba(255,255,255,0.8); }
.sw { width: 20px; height: 20px; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.2); border: 2px solid white; }

details { background: rgba(255,255,255,0.2); padding: 16px; border-radius: 16px; font-size: 0.9rem; font-weight: 500; line-height: 1.6; border: 1px solid var(--border); }
summary { font-weight: 700; color: var(--acc); cursor: pointer; outline: none; margin-bottom: 8px; }
summary::marker { color: var(--acc); }
.pts { align-self: flex-start; background: var(--acc); color: white; padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 800; letter-spacing: 0.5px; box-shadow: 0 4px 10px rgba(255, 71, 87, 0.3); }
</style>
</head>
<body>
<main>
  <h1>StyleIA</h1>
  <p class="sub">Descubre tu outfit perfecto impulsado por nuestro sistema experto.</p>
  
  <form id="f" class="glass">
    <label>Lugar <select id="lugar"></select></label>
    <label>Clima <select id="temperatura"></select></label>
    <label>Paleta <select id="temporada"></select></label>
    <label>Capas <select id="capas"></select></label>
    <button type="submit" id="btn-buscar">Generar Recomendaciones</button>
  </form>
  
  <div id="estado"></div>
  <div id="resultados"></div>
</main>
<script>
const HEX={rojo_vivo:'#e81900',amarillo_claro:'#fff59e',ocre_mostaza:'#c3a55c',verde_petroleo:'#417777',
rojo_granate:'#740909',menta_palido:'#abf5ed',rojo_carmesi:'#a10b2b',azul_brillante:'#0d75ff',azul_marino:'#0d2b52',
verde_sage:'#9cb29e',negro:'#000000',lavanda:'#b875eb',rosa_palido:'#d1b0b3',turquesa:'#29bdad',azul_cobalto:'#202d85',
amarillo_neon:'#f2ff26',verde_boscoso:'#172713',verde_menta:'#6bffb3',marron_terracota:'#6c2b11',marron_oscuro:'#362304',
blanco:'#ffffff',gris:'#8c8c8c',beige:'#d8c8a8',crema:'#f3ecd2',azul_denim:'#3b5b8c',
verde_pera:'#d1e231',agua_menta:'#a8e6cf',azul_cielo:'#87ceeb',verde_jade:'#00a86b'};
const ETIQ={otonio:'Otoño',neutros:'Solo neutros',todas:'Todas (1 a 3)',frio:'Frío'};
const nom=s=>String(s).replace(/_/g,' ');
const cap=s=>{s=nom(s);return s.charAt(0).toUpperCase()+s.slice(1)};
const etiq=v=>ETIQ[v]||(typeof v==='number'?v+(v===1?' capa':' capas'):cap(v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);

function llenar(id,vals){
  $(id).innerHTML=vals.map(v=>`<option value="${esc(v)}">${esc(etiq(v))}</option>`).join('');
}
fetch('/api/opciones').then(r=>r.json()).then(o=>{
  llenar('lugar',o.lugares);llenar('temperatura',o.temperaturas);
  llenar('temporada',o.temporadas);llenar('capas',o.capas);
}).catch(()=>{$('estado').textContent='No se pudo conectar con el servidor.'});

function prenda(p){
  const hex=HEX[p.color]||'#cccccc';
  return `<span class="chip"><span class="sw" style="background:${hex}"></span>${esc(cap(p.tipo))} · ${esc(nom(p.color))}</span>`;
}
function detalle(e){
  if(!e)return '';
  let motivos = e.parejas.map(p => {
    if(p.motivo === 'igual') return 'comparte tonos idénticos';
    if(p.motivo === 'neutro') return 'equilibra con tonos neutros';
    return 'aprovecha los colores de la temporada';
  });
  let colorExp = [...new Set(motivos)].join(' y '); 
  
  return `<details><summary>¿Por qué se recomienda?</summary>
    Apto para el clima y la formalidad del evento. Combina bien porque ${colorExp || 'mantiene un tono uniforme'}.</details>`;
}
function tarjeta(o, index){
  // Animación en cascada sumando 0.1s por cada resultado
  return `<div class="card glass" style="animation: slideUp 0.6s ease backwards ${index * 0.1}s">
    <span class="pts">★ ${esc(o.puntaje)} Puntos de color</span>
    <div class="prendas">${o.prendas.map(prenda).join('')}</div>${detalle(o.explicacion)}</div>`;
}

$('f').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const v=id=>$(id).value;
  const capas=isNaN(v('capas'))?v('capas'):Number(v('capas'));
  const btn=$('btn-buscar');
  
  btn.textContent='Analizando Clóset...';
  btn.disabled=true;
  $('estado').textContent='';
  $('resultados').innerHTML='';
  
  try{
    const r=await fetch('/api/recomendar',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({lugar:v('lugar'),temperatura:v('temperatura'),temporada:v('temporada'),capas})});
    const d=await r.json();
    
    if(d.estado!=='ok'){
      $('estado').innerHTML=`<div class="msg glass">${esc(d.mensaje||'Ocurrió un error.')}</div>`;
    }else if(d.outfits.length===0){
      $('estado').innerHTML='<div class="msg glass">No se encontró ningún outfit con esas condiciones. Prueba otra paleta, otro número de capas u otro clima.</div>';
    }else{
      $('estado').textContent='✨ Outfits recomendados para ti ✨';
      $('resultados').innerHTML=d.outfits.map((o, i) => tarjeta(o, i)).join('');
    }
  }catch(e){
    $('estado').innerHTML='<div class="msg glass">No se pudo conectar con el servidor.</div>';
  }finally{
    btn.textContent='Generar Recomendaciones';
    btn.disabled=false;
  }
});
</script>
</body>
</html>
