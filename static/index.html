<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creador de outfits</title>
<style>
:root {
  --bg: #f3f4f6; --card: #ffffff; --ink: #111827; --mut: #6b7280; 
  --acc: #4f46e5; --acc-hover: #4338ca; --line: #e5e7eb;
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
}
@media(prefers-color-scheme:dark) {
  :root {
    --bg: #111827; --card: #1f2937; --ink: #f9fafb; --mut: #9ca3af; 
    --acc: #6366f1; --acc-hover: #818cf8; --line: #374151;
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, sans-serif; line-height: 1.6; transition: background-color 0.3s, color 0.3s; }
main { max-width: 800px; margin: 0 auto; padding: 40px 20px 80px; }
h1 { font-size: 2.5rem; font-weight: 800; margin: 0 0 8px; text-align: center; letter-spacing: -0.025em; }
.sub { color: var(--mut); margin: 0 0 32px; text-align: center; font-size: 1.1rem; }
form { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: grid; gap: 16px; grid-template-columns: 1fr 1fr; box-shadow: var(--shadow); }
label { display: grid; gap: 6px; font-size: 0.85rem; font-weight: 600; color: var(--mut); text-transform: uppercase; letter-spacing: 0.05em; }
select { font: 1rem system-ui, sans-serif; padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; outline: none; transition: border-color 0.2s; }
select:focus { border-color: var(--acc); }
button { grid-column: 1 / -1; background: var(--acc); color: #fff; border: 0; padding: 14px; border-radius: 8px; font-size: 1.1rem; font-weight: 600; cursor: pointer; box-shadow: 0 4px 6px rgba(79, 70, 229, 0.2); transition: transform 0.1s, background-color 0.2s; }
button:hover { background: var(--acc-hover); transform: translateY(-2px); }
button:active { transform: translateY(0); }
button:disabled { background: var(--mut); cursor: not-allowed; transform: none; box-shadow: none; }
@media(max-width: 520px) { form { grid-template-columns: 1fr; } }
#estado { margin: 24px 0 16px; color: var(--ink); font-weight: 600; text-align: center; font-size: 1.1rem; }
.msg { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; text-align: center; color: var(--mut); box-shadow: var(--shadow); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; margin-bottom: 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 16px; transition: transform 0.2s; }
.card:hover { transform: translateY(-2px); }
.prendas { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--bg); border-radius: 20px; padding: 6px 14px 6px 8px; font-size: 0.95rem; font-weight: 500; }
.sw { width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15); }
details { margin-top: 8px; font-size: 0.95rem; color: var(--mut); background: var(--bg); padding: 16px; border-radius: 12px; border: 1px solid var(--line); }
summary { cursor: pointer; color: var(--acc); font-weight: 600; outline: none; }
.pts { align-self: flex-start; background: var(--line); padding: 4px 12px; border-radius: 12px; font-size: 0.85rem; font-weight: 600; color: var(--mut); }
</style>
</head>
<body>
<main>
  <h1>Creador de outfits</h1>
  <p class="sub">Elige el lugar, el clima y la paleta, y el sistema experto en Prolog arma las combinaciones posibles de tu clóset.</p>
  <form id="f">
    <label>Lugar<select id="lugar"></select></label>
    <label>Temperatura<select id="temperatura"></select></label>
    <label>Paleta de temporada<select id="temporada"></select></label>
    <label>Capas<select id="capas"></select></label>
    <button type="submit" id="btn-buscar">Buscar outfits</button>
  </form>
  <div id="estado"></div>
  <div id="resultados"></div>
</main>
<script>
// Los codigos hex solo sirven para DIBUJAR las muestras; las decisiones las toma Prolog.
const HEX={rojo_vivo:'#e81900',amarillo_claro:'#fff59e',ocre_mostaza:'#c3a55c',verde_petroleo:'#417777',
rojo_granate:'#740909',menta_palido:'#abf5ed',rojo_carmesi:'#a10b2b',azul_brillante:'#0d75ff',azul_marino:'#0d2b52',
verde_sage:'#9cb29e',negro:'#000000',lavanda:'#b875eb',rosa_palido:'#d1b0b3',turquesa:'#29bdad',azul_cobalto:'#202d85',
amarillo_neon:'#f2ff26',verde_boscoso:'#172713',verde_menta:'#6bffb3',marron_terracota:'#6c2b11',marron_oscuro:'#362304',
blanco:'#ffffff',gris:'#8c8c8c',beige:'#d8c8a8',crema:'#f3ecd2',azul_denim:'#3b5b8c',
verde_pera:'#d1e231',agua_menta:'#a8e6cf',azul_cielo:'#87ceeb',verde_jade:'#00a86b'};
const ETIQ={otonio:'Otoño',neutros:'Solo neutros',todas:'Todas (1 a 3)',frio:'Frío'};
const nom=s=>String(s).replace(/_/g,' ');
const cap=s=>{s=nom(s);return s.charAt(0).toUpperCase()+s.slice(1)};
const etiq=v=>ETIQ[v]||(typeof v==='number'?v+(v===1?' capa':' capas'):cap(v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);

function llenar(id,vals){
  $(id).innerHTML=vals.map(v=>`<option value="${esc(v)}">${esc(etiq(v))}</option>`).join('');
}
fetch('/api/opciones').then(r=>r.json()).then(o=>{
  llenar('lugar',o.lugares);llenar('temperatura',o.temperaturas);
  llenar('temporada',o.temporadas);llenar('capas',o.capas);
}).catch(()=>{$('estado').textContent='No se pudo conectar con el servidor.'});

function prenda(p){
  const hex=HEX[p.color]||'#cccccc';
  return `<span class="chip"><span class="sw" style="background:${hex}"></span>${esc(cap(p.tipo))} · ${esc(nom(p.color))}</span>`;
}
function detalle(e){
  if(!e)return '';
  let motivos = e.parejas.map(p => {
    if(p.motivo === 'igual') return 'comparte tonos idénticos';
    if(p.motivo === 'neutro') return 'equilibra con tonos neutros';
    return 'aprovecha los colores de la temporada';
  });
  let colorExp = [...new Set(motivos)].join(' y '); 
  
  return `<details><summary>¿Por qué se recomienda?</summary>
    Apto para el clima y la formalidad del evento. Combina bien porque ${colorExp || 'mantiene un tono uniforme'}.</details>`;
}
function tarjeta(o){
  return `<div class="card"><span class="pts">Colores de la paleta: ${esc(o.puntaje)}</span>
    <div class="prendas">${o.prendas.map(prenda).join('')}</div>${detalle(o.explicacion)}</div>`;
}

$('f').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const v=id=>$(id).value;
  const capas=isNaN(v('capas'))?v('capas'):Number(v('capas'));
  const btn=$('btn-buscar');
  
  btn.textContent='Buscando...';
  btn.disabled=true;
  $('estado').textContent='';
  $('resultados').innerHTML='';
  
  try{
    const r=await fetch('/api/recomendar',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({lugar:v('lugar'),temperatura:v('temperatura'),temporada:v('temporada'),capas})});
    const d=await r.json();
    
    if(d.estado!=='ok'){
      $('estado').innerHTML=`<div class="msg">${esc(d.mensaje||'Ocurrió un error.')}</div>`;
    }else if(d.outfits.length===0){
      $('estado').innerHTML='<div class="msg">No se encontró ningún outfit con esas condiciones. Prueba otra paleta, otro número de capas u otro clima.</div>';
    }else{
      $('estado').textContent='Outfits recomendados, ordenados por mayor uso de colores de la paleta.';
      $('resultados').innerHTML=d.outfits.map(tarjeta).join('');
    }
  }catch(e){
    $('estado').innerHTML='<div class="msg">No se pudo conectar con el servidor.</div>';
  }finally{
    btn.textContent='Buscar outfits';
    btn.disabled=false;
  }
});
</script>
</body>
</html>
